<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>圆桌辩论 · 多 Agent 协作</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">圆桌辩论<span class="logo-sub">多 Agent 协作</span></div>
    <div class="topbar-right">
      <button id="btn-history" class="ghost-btn">历史记录</button>
      <div id="status-pill" class="pill idle">空闲</div>
    </div>
  </header>

  <!-- ============ 配置界面 ============ -->
  <main id="setup" class="panel setup">
    <section class="config-box">
      <div class="config-head">
        <h2>参与者配置</h2>
        <span class="hint">席位 · 角色 · 立场</span>
      </div>
      <div class="row">
        <label>Agent 数量（2-6）</label>
        <input type="number" id="agent-count" min="2" max="6" value="3" />
        <button id="btn-gen-agents">生成席位</button>
        <span class="hint" id="backend-hint"></span>
      </div>
      <div id="agent-cards" class="agent-cards"></div>
    </section>

    <aside class="config-box">
      <div class="config-head">
        <h2>讨论设置</h2>
        <span class="hint">主题 · 轮次 · 知识库</span>
      </div>
      <div class="field">
        <label>讨论主题 / 任务发布</label>
        <textarea id="topic" rows="4" placeholder="例如：请各位协作设计一款面向学生的 AI 学习助手的产品方案。"></textarea>
      </div>
      <div class="row">
        <label>最大讨论轮次</label>
        <input type="number" id="max-rounds" min="1" max="30" value="8" />
      </div>
      <div class="row">
        <label>Token 预算</label>
        <input type="number" id="budget" min="1000" step="1000" value="100000" />
        <span class="hint">预算熔断：剩余不足阈值时强制进入裁决</span>
      </div>

      <div class="config-sub">
        <div class="config-sub-title">共享知识库</div>
        <div class="field">
          <label>向共享向量库注入资料（可选）</label>
          <textarea id="kb-text" rows="4" placeholder="每行一段知识，所有 Agent 均可检索。"></textarea>
          <div class="row">
            <button id="btn-ingest">注入知识</button>
            <span class="hint" id="ingest-hint"></span>
          </div>
          <div class="row">
            <input type="file" id="kb-file" accept=".txt,.md,.csv,.log,.docx,.xlsx,.pdf,.png,.jpg,.jpeg,.bmp,.webp" />
            <button id="btn-upload">上传解析</button>
            <span class="hint" id="upload-hint"></span>
          </div>
        </div>
      </div>

      <div class="config-sub">
        <div class="config-sub-title">独立裁判设置（可选）</div>
        <div class="row">
          <label>裁判名称</label>
          <input id="judge-name" value="独立裁判" />
        </div>
        <div class="row">
          <label>裁判模型</label>
          <select id="judge-provider">
            <option value="default">默认（.env）</option>
            <option value="qwen">Qwen</option>
            <option value="deepseek">DeepSeek</option>
            <option value="mimo">MiMo</option>
            <option value="custom">自定义</option>
          </select>
        </div>
        <div id="judge-custom" class="custom-fields hidden">
          <div class="field"><label>Base URL</label><input id="judge-base-url" placeholder="https://..."></div>
          <div class="field"><label>API Key</label><input id="judge-api-key" type="password" placeholder="sk-..."></div>
          <div class="field"><label>Model ID</label><input id="judge-model-id" placeholder="model-name"></div>
        </div>
        <span class="hint">裁判为独立 Agent，仅对各辩手的辩论表现按辩手逐一评分，不参与辩论、不看主持人任务分派内容。</span>
      </div>

      <div class="actions">
        <button id="btn-start" class="primary">进入圆桌并开始讨论</button>
      </div>
      <div id="setup-error" class="error"></div>
    </aside>
  </main>

  <!-- ============ 讨论界面 ============ -->
  <main id="discussion" class="panel discussion hidden">
    <div class="stage">
      <div class="table-wrap">
        <div id="round-table" class="round-table">
          <div id="table-center" class="table-center">
            <div id="center-topic" class="center-topic">圆桌讨论</div>
            <div id="center-round" class="center-round">第 0 / 0 轮</div>
            <div id="center-progress" class="center-progress"></div>
          </div>
        </div>
      </div>

      <div class="side">
        <div class="controls">
          <button id="btn-pause">暂停</button>
          <button id="btn-resume" class="hidden">继续</button>
          <button id="btn-end">结束</button>
          <button id="btn-back" class="ghost-btn">返回配置</button>
        </div>
        <div class="ctx-box">
          <div class="box-title">运行状态</div>
          <div id="run-status" class="ctx-list"><div class="muted">未开始</div></div>
        </div>
        <div class="ctx-box">
          <div class="box-title">任务接收方变量</div>
          <div id="ctx-list" class="ctx-list"><div class="muted">暂无</div></div>
        </div>
        <div class="ctx-box">
          <div class="box-title">任务进度</div>
          <div id="task-list" class="task-list"><div class="muted">暂无任务</div></div>
        </div>
      </div>
    </div>

    <div class="transcript-box">
      <div class="box-title">讨论记录</div>
      <div id="transcript" class="transcript"></div>
    </div>

    <div id="done-bar" class="done-bar hidden">
      <span id="done-msg"></span>
      <button id="btn-export">预览 Markdown</button>
      <button id="btn-download" class="primary">一键导出 Markdown</button>
    </div>
  </main>

  <!-- ============ 历史讨论弹窗 ============ -->
  <div id="history-modal" class="modal hidden">
    <div class="modal-content history-modal">
      <div class="modal-head">
        <span>历史讨论</span>
        <button id="btn-history-close">✕</button>
      </div>
      <div class="history-layout">
        <div class="history-side">
          <input id="history-search" type="search" placeholder="搜索题目关键词…" />
          <div id="history-list" class="history-list">
            <div class="muted pad">加载中…</div>
          </div>
        </div>
        <div class="history-view">
          <div class="history-view-head">
            <span id="history-view-title" class="history-title">选择左侧记录查看</span>
            <button id="btn-history-download" class="ghost-btn">导出 Markdown</button>
          </div>
          <div id="history-md" class="md-preview"><div class="muted pad">暂无内容</div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ Markdown 预览弹窗 ============ -->
  <div id="md-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-head">
        <span>讨论结果（Markdown）</span>
        <button id="btn-md-close">✕</button>
      </div>
      <div id="md-text" class="md-preview"></div>
    </div>
  </div>

  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
