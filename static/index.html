<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多 Agent 圆桌协作系统</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">🛸 多 Agent 圆桌协作</div>
    <div id="status-pill" class="pill idle">空闲</div>
  </header>

  <!-- ============ 配置界面 ============ -->
  <section id="setup" class="panel">
    <h2>① 配置圆桌参与者</h2>
    <div class="row">
      <label>Agent 数量（2-6）：</label>
      <input type="number" id="agent-count" min="2" max="6" value="3" />
      <button id="btn-gen-agents">生成席位</button>
      <span class="hint" id="backend-hint"></span>
    </div>

    <div id="agent-cards" class="agent-cards"></div>

    <h2>② 讨论设置</h2>
    <div class="row col">
      <label>讨论主题 / 任务发布：</label>
      <textarea id="topic" rows="3" placeholder="例如：请各位协作设计一款面向学生的 AI 学习助手的产品方案。"></textarea>
    </div>
    <div class="row">
      <label>最大讨论轮次：</label>
      <input type="number" id="max-rounds" min="1" max="30" value="8" />
    </div>

    <h2>③ 共享知识库（可选）</h2>
    <div class="row col">
      <label>向共享向量库注入资料：</label>
      <textarea id="kb-text" rows="3" placeholder="每行一段知识，所有 Agent 均可检索。"></textarea>
      <button id="btn-ingest">注入知识</button>
      <span class="hint" id="ingest-hint"></span>
    </div>

    <div class="actions">
      <button id="btn-start" class="primary">▶ 进入圆桌并开始讨论</button>
    </div>
    <div id="setup-error" class="error"></div>
  </section>

  <!-- ============ 讨论界面 ============ -->
  <section id="discussion" class="panel hidden">
    <div class="stage">
      <div class="table-wrap">
        <div id="round-table" class="round-table">
          <div id="table-center" class="table-center">
            <div id="center-topic" class="center-topic">圆桌讨论</div>
            <div id="center-round" class="center-round">第 0 / 0 轮</div>
            <div id="center-progress" class="center-progress"></div>
          </div>
        </div>
      </div>

      <div class="side">
        <div class="controls">
          <button id="btn-pause">⏸ 暂停</button>
          <button id="btn-resume" class="hidden">▶ 继续</button>
          <button id="btn-end">⏹ 结束</button>
          <button id="btn-back">↩ 返回配置</button>
        </div>
        <div class="ctx-box">
          <div class="box-title">任务接收方变量（共享上下文）</div>
          <div id="ctx-list" class="ctx-list"><div class="muted">暂无</div></div>
        </div>
        <div class="ctx-box">
          <div class="box-title">任务进度</div>
          <div id="task-list" class="task-list"><div class="muted">暂无任务</div></div>
        </div>
      </div>
    </div>

    <div class="transcript-box">
      <div class="box-title">讨论记录（实时）</div>
      <div id="transcript" class="transcript"></div>
    </div>

    <div id="done-bar" class="done-bar hidden">
      <span id="done-msg"></span>
      <button id="btn-export">📄 导出 Markdown</button>
      <button id="btn-download">⬇ 下载</button>
    </div>
  </section>

  <!-- Markdown 弹窗 -->
  <div id="md-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-head">
        <span>讨论结果（Markdown）</span>
        <button id="btn-md-close">✕</button>
      </div>
      <pre id="md-text" class="md-text"></pre>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
