# 项目元信息与工程化配置
# - requires-python：明确最低解释器版本（CI 使用 3.11，本地 agent_env 为 3.10）
# - ruff：静态检查（Python lint / import 排序）
# - mypy：类型检查（当前仅覆盖协议模型 muti_llm_agent/protocol.py，全量开启为后续工作）
# - coverage：测试覆盖率
[project]
name = "muti-llm-agent"
version = "1.0.0"
description = "单用户个人级多模型协同工作台（多 LLM 分工协同 / 流式 UI / 中途纠偏 / 复盘 / 对外集成）"
requires-python = ">=3.10"

# 开发依赖见 requirements-dev.txt（ruff / mypy / coverage）

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
# E4/E7/E9/F：语法与真错误；I：import 排序；UP：现代语法（自动修复后全绿）
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF", "B", "S"]
# BLE001：本项目刻意使用宽泛异常捕获做鲁棒降级（多处已带 # noqa 标注），
#         在配置层统一放行，避免为历史代码逐处打标；
# S110（try-except-pass）不再全局放行：静默吞掉异常是本项目最容易积累的债。
#         确有理由保持沉默的地方必须在该行写明 `# noqa: S110 - <理由>`，
#         让「为什么这里可以不记日志」在代码里可查，而不是靠全局豁免隐身；
#         注：ruff 的 S110 只约束宽泛捕获（except Exception / bare except），
#         具体异常类型的 `pass` 不会被它命中，那种情况用注释写明原因即可。
# RUF001/002/003：全角中文标点（：，。等）在源码/文档/注释中是刻意用法，
#         属中文代码库误报，统一忽略。
ignore = ["BLE001", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# 测试文件允许 assert（S101）与本地 HTTP 测试端点（S310）
"tests/*" = ["S101", "S310"]

[tool.mypy]
python_version = "3.10"
# 类型检查覆盖整个 muti_llm_agent/ 包（此前仅 protocol.py，其余 20+ 模块完全没有类型门禁）。
files = ["muti_llm_agent"]
ignore_missing_imports = true
# 只检查本仓库代码：不跟进 sentence-transformers / torch / qdrant-client 等
# 巨型依赖的类型分析（否则单文件检查也要数分钟）
follow_imports = "skip"
# 历史模块大量函数未注解：显式关闭"必须注解"类检查，保证门禁结果与 mypy 版本
# 默认值无关（不同版本对隐式 strict 的默认值不一致，会让 CI 莫名其妙地飘）。
# 保留的错误类别仍能拦截：拼错属性、传错参数、返回类型不符、无效 ignore 等。
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
no_implicit_optional = false
warn_return_any = false
# 协议层（muti_llm_agent/protocol.py）的 strict 校验在 CI 里以独立命令执行：
#   python -m mypy --strict muti_llm_agent/protocol.py
# 这样"整包宽口径 + 契约严口径"两个门禁都在，互不影响。

[tool.coverage.run]
source = ["muti_llm_agent"]
branch = true

[tool.coverage.report]
show_missing = true
