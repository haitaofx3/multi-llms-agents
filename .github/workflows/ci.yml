name: CI

on:
  push:
    branches: [main, agent_v01]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 依赖清单在 requirements-ci.txt，不在本文件里手写。
      # 这样「CI 装了什么」就成了仓库里可被机器校验的事实：
      # tests/test_dependency_closure.py 会强制它覆盖所有模块级第三方导入。
      # （历史上就因为这份清单手写在 YAML 里、漏了 pytest / websockets，
      #   导致 CI 在采集阶段直接崩，而本地永远复现不出来。）
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      # 门禁的唯一定义在 scripts/gate.py，本地与 CI 跑的是同一段代码：
      #   ruff -> mypy 整包 -> mypy --strict(协议层) -> compileall
      #   -> node --check ×3 -> pytest + 覆盖率下限
      # 本地提交前可以用同一条命令自查：python scripts/gate.py
      - name: Quality gate
        run: python scripts/gate.py --ci
