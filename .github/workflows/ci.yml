name: CI

on:
  push:
    branches: [main, agent_v01]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 仅安装快速测试所需的最小依赖（app 在无 sentence-transformers /
      # Qdrant 时会自动降级为哈希向量 + 内存向量库，见 app/embeddings.py、
      # app/vector_store.py）。完整 requirements.txt 会拉取 torch，不适用于 CI。
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pydantic openai fastapi httpx ruff mypy

      - name: Lint (ruff)
        run: python -m ruff check app tests

      - name: Type check (mypy, app/protocol.py)
        run: python -m mypy

      - name: Build check (Python byte-compile)
        run: python -m compileall -q app

      - name: Build check (JS syntax)
        run: node --check app/static/app.js

      # 无需真实 LLM API 的确定性单元测试（暂停/继续/结束控制流 + 手动结束收尾）
      - name: Run fast unit tests
        run: python -m unittest tests.test_ci_fast -v

      # 接口级集成测试：走 ASGITransport 驱动完整 HTTP 流程，LLM 调用点已替换为桩
      - name: Run API flow tests
        run: python -m unittest tests.test_api_flow -v

      # tests/test_e2e.py 需要启动服务器 + 真实 LLM API，且单次调用 >90s，
      # 不适合作为常规 CI 检查；如需可在此处手动触发。
